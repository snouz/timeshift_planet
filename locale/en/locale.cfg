[technology-description]
panglia_planet_discovery_panglia=Panglia is a strange lush moon of Gleba where you can find energy from vegetation, strange duplicating materials and places where time warps in unnatural ways.
panglia_branbalite_slurry=Highly nutritious plant.
panglia_branbalite_slurry_to_crudeoil=Turn branbalite into crude oil.
panglia_panglite_multiplication=Panglite expands indefinitely when heated.
panglia_panglite_fiber=A most resistant and versatile material, can be turned into low density structure.
panglia_advanced_optics_nanotech=You can manipulate molecules directly.
panglia_dna_manipulation=Give birth to new organisms by creating a unique DNA.
panglia_simulation_chamber=Hosts organisms to stay in relative stasis.
panglia_simulation_matrix=Create a full virtual reality that you connect your organisms to, making them live an entirely fictional lifespan.
panglia_sentient_processor=Upload a consciousness to a computer. The combination of biology and AI might be the most complete form of processing power.

panglia_worker-robots-speed=Complete rework of internal circuitry, allowing for even faster workers.
panglia_worker-robots-storage=Smarter way to grab and transport items. Workers get more storage.
panglia_crusher=Crushes any material into a very thin composite powder.
panglia_igneous_rock_to_lava=Melt igneous rocks into lava.
panglia_tech_timewarp_data=Collect [font=moshine-data][color=#00ffff]time_flow.data[/color][/font] from timewarp zones to understand how to influence time flow.
panglia_tech_timewarp_data_nocolor=Collect time_flow.data from timewarp zones to understand how to influence time flow.


