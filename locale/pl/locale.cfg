panglia_simulation_chamber=Umożliwia utrzymywanie organizmów w stanie względnej stagnacji.
panglia_simulation_matrix=Stwórz pełną rzeczywistość wirtualną, z którą połączysz swoje organizmy, pozwalając im przeżyć całkowicie fikcyjne życie.
panglia_sentient_processor=Przenieś świadomość do komputera. Połączenie biologii i sztucznej inteligencji może być najbardziej kompletną formą mocy obliczeniowej.

panglia_worker-robots-speed=Całkowita przebudowa obwodów wewnętrznych, umożliwiająca jeszcze szybszą pracę robotów.
panglia_worker-robots-storage=Inteligentniejszy sposób chwytania i transportu przedmiotów. Roboty zyskują więcej miejsca do przechowywania.
panglia_crusher=Rozdrabnia dowolny materiał na bardzo drobny proszek kompozytowy.
panglia_igneous_rock_to_lava=Topnienie skał magmowych

