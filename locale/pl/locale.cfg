[technology-description]
panglia_planet_discovery_panglia=Panglia to bujny obcy świat z potężnymi korzeniami, dziwnymi materiałami i strefami antyliniowymi.
panglia_branbalite_slurry=Roślina o wysokiej wartości odżywczej.
panglia_branbalite_slurry_to_crudeoil=Przetwarzanie branbalitu w ropę naftową.
panglia_panglite_multiplication=Panglit rozszerza się w nieskończoność po podgrzaniu.
panglia_panglite_fiber=Najbardziej wytrzymały i wszechstronny materiał, który można przekształcić w strukturę niskiej gęstości.
panglia_advanced_optics_nanotech=Możesz bezpośrednio manipulować cząsteczkami.
