[technology-description]
panglia_planet_discovery_panglia=Panglia ist eine üppige Alien-Welt mit mächtigen Wurzeln, seltsamen Materialien und antilinearen Zonen.
panglia_branbalite_slurry=Äußerst nährstoffreiche Pflanze.
panglia_branbalite_slurry_to_crudeoil=Verarbeitet Branbalit zu Rohöl.
panglia_panglite_multiplication=Panglit dehnt sich bei Erwärmung unbegrenzt aus.
panglia_panglite_fiber=Ein äußerst widerstandsfähiges und vielseitiges Material, das zu Leichtbauteilen verarbeitet werden kann.
panglia_advanced_optics_nanotech=Sie können Moleküle direkt manipulieren.
panglia_dna_manipulation=Schaffen Sie neue Organismen, indem Sie eine einzigartige DNS erschaffen.
panglia_simulation_chamber=Beherbergt Organismen, damit sie in relativer Stasis bleiben.
panglia_simulation_matrix=Erstellen Sie eine vollständige virtuelle Realität, mit der Sie Ihre Organismen verbinden, sodass sie ein völlig fiktives Leben führen.
panglia_sentient_processor=Laden Sie ein Bewusstsein auf einen Computer hoch. Die Kombination aus Biologie und KI könnte die vollständigste Form der Rechenleistung sein.

panglia_worker-robots-speed=Komplette Überarbeitung der internen Schaltkreise, wodurch die Roboter noch schneller werden.
panglia_worker-robots-storage=Intelligentere Methode zum Greifen und Transportieren von Gegenständen. Die Roboter erhalten mehr Stauraum.
panglia_crusher=Zerkleinert jedes Material zu einem sehr feinen Verbundpulver.
panglia_igneous_rock_to_lava=Schmelzen von Magmagestein
panglia_tech_timewarp_data=Sammle [font=moshine-data][color=#00ffff]zeitfluss.data[/color][/font] aus Zeitsprung-Zonen, um zu verstehen, wie man den Zeitfluss beeinflussen kann.
